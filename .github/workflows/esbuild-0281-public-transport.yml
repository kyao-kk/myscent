name: esbuild-0281-public-transport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decode and verify exact esbuild Git blob
        env:
          BLOB_API: https://api.github.com/repos/ortenburger/liquid_copy/git/blobs/71fe4f8318ca6039f84b0165618f921eb3cab609
        run: |
          set -euo pipefail
          mkdir -p transport
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$BLOB_API" > transport/blob.json
          python3 - <<'PY'
          import base64, hashlib, json, pathlib

          root = pathlib.Path('transport')
          payload = json.loads((root / 'blob.json').read_text(encoding='utf-8'))
          encoded = ''.join(payload['content'].split())
          data = base64.b64decode(encoded, validate=True)
          actual = {
              'size': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'sha512': hashlib.sha512(data).hexdigest(),
              'gitBlobSha1': hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest(),
              'elfMagic': data[:4].hex(),
          }
          expected = {
              'size': 11_407_472,
              'sha256': '0c6588b092a2c291a72bab90659f3c9e0e25e0fe59c9ac12b4dae4d945e5548c',
              'sha512': '495e42655661c20223623aaeebe8206c19ef7e4bea1e4b87d87a218670a90c7d1a84df49d8820abcc32152a60c0513d48b9fef0fc4b1a03355dbb5f592450333',
              'gitBlobSha1': '71fe4f8318ca6039f84b0165618f921eb3cab609',
              'elfMagic': '7f454c46',
          }
          if actual != expected:
              raise SystemExit(f'identity mismatch: {actual!r}')
          binary = root / 'esbuild'
          binary.write_bytes(data)
          binary.chmod(0o755)
          receipt = {
              'status': 'verified',
              'sourceRepository': 'ortenburger/liquid_copy',
              'sourceBlob': expected['gitBlobSha1'],
              'identity': actual,
              'officialVersion': '0.28.1',
              'shippingRuntime': False,
              'projectP0': False,
              'gameplayAccepted': False,
          }
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          ./transport/esbuild --version | tee transport/version.txt
          test "$(cat transport/version.txt)" = '0.28.1'
          rm transport/blob.json

      - name: Upload verified one-day artifact
        uses: actions/upload-artifact@v4
        with:
          name: esbuild-0.28.1-linux-x64-verified
          path: |
            transport/esbuild
            transport/receipt.json
            transport/version.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Probe same-owner private repository read scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/kyao-kk/douyingame)"
          echo "PRIVATE_REPO_HTTP_STATUS=$status"
          if [ "$status" = '200' ]; then
            echo 'PRIVATE_REPO_READ_SCOPE=true'
          else
            echo 'PRIVATE_REPO_READ_SCOPE=false'
          fi
