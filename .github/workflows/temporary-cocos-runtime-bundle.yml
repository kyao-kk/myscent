name: temporary-cocos-runtime-bundle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover-and-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe bounded Creator 3.8.8 Windows candidates
        run: |
          set -uo pipefail
          mkdir -p bundle/probes bundle/cocos bundle/wine bundle/dashboard
          cat > bundle/probes/candidates.txt <<'EOF'
          https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-121518.zip
          https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-121518.exe
          https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-121518.zip
          https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-121518.exe
          https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-010512.zip
          https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-010512.exe
          EOF
          : > bundle/probes/http-status.txt
          while IFS= read -r url; do
            status="$(curl --location --silent --show-error --output /dev/null --connect-timeout 20 --max-time 90 --write-out '%{http_code} %{size_download} %{url_effective}' "$url" || true)"
            printf '%s | %s\n' "$status" "$url" | tee -a bundle/probes/http-status.txt
          done < bundle/probes/candidates.txt

      - name: Download official Dashboard and inspect installer payload
        env:
          DASHBOARD_URL: https://download.cocos.com/CocosDashboard/v2.2.1/CocosDashboard-v2.2.1-win-112616.exe
          DASHBOARD_SHA256: f47e0bfc5bccd452361160784c6062b0b30b9933854ebc04346b8322aee3d9aa
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 10 "$DASHBOARD_URL" -o bundle/dashboard/CocosDashboard-v2.2.1-win-112616.exe
          echo "$DASHBOARD_SHA256  bundle/dashboard/CocosDashboard-v2.2.1-win-112616.exe" | sha256sum --check
          file bundle/dashboard/CocosDashboard-v2.2.1-win-112616.exe | tee bundle/dashboard/file.txt
          7z l bundle/dashboard/CocosDashboard-v2.2.1-win-112616.exe > bundle/dashboard/installer-contents.txt || true
          strings -a bundle/dashboard/CocosDashboard-v2.2.1-win-112616.exe | grep -Eio 'https?://[^ "<>]+' | sort -u > bundle/dashboard/installer-urls.txt || true

      - name: Download and verify portable Wine independently
        env:
          WINE_URL: https://github.com/Kron4ek/Wine-Builds/releases/download/11.11/wine-11.11-staging-amd64-wow64.tar.xz
          WINE_SHA256: bf9ba91bccd3129bd8dee31dcff76e94b38898cee70b9ecf4dda4c0d8d9df25a
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 10 "$WINE_URL" -o bundle/wine/wine-11.11-staging-amd64-wow64.tar.xz
          echo "$WINE_SHA256  bundle/wine/wine-11.11-staging-amd64-wow64.tar.xz" | sha256sum --check
          tar -tf bundle/wine/wine-11.11-staging-amd64-wow64.tar.xz | head -200 > bundle/wine/wine-contents.txt

      - name: Download any verified Creator candidate
        run: |
          set -uo pipefail
          while IFS= read -r url; do
            code="$(curl --location --silent --show-error --output /dev/null --connect-timeout 20 --max-time 90 --write-out '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then
              name="${url##*/}"
              curl --fail --location --retry 3 --retry-delay 10 "$url" -o "bundle/cocos/$name"
              sha256sum "bundle/cocos/$name" > "bundle/cocos/$name.sha256"
              file "bundle/cocos/$name" > "bundle/cocos/$name.file.txt"
              if [[ "$name" == *.zip ]]; then unzip -t "bundle/cocos/$name"; fi
              printf '%s\n' "$url" > bundle/cocos/source-url.txt
              exit 0
            fi
          done < bundle/probes/candidates.txt
          echo 'No bounded Windows Creator candidate returned HTTP 200.' | tee bundle/cocos/not-found.txt
          exit 0

      - name: Write bundle manifest
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          files=[]
          for path in sorted(pathlib.Path('bundle').rglob('*')):
              if path.is_file():
                  files.append({'path': str(path), 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          pathlib.Path('bundle/runtime-bundle-manifest.json').write_text(json.dumps({'schemaVersion':1,'files':files},indent=2)+'\n')
          PY
          cat bundle/runtime-bundle-manifest.json

      - name: Upload portable runtime and discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: cocos-runtime-discovery-bundle
          path: bundle
          compression-level: 0
          if-no-files-found: error

  run-official-macos-editor:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and unpack official Cocos Creator 3.8.8 macOS package
        env:
          COCOS_URL: https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-mac-010512.zip
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/cocos" "$RUNNER_TEMP/evidence"
          curl --fail --location --retry 3 --retry-delay 10 "$COCOS_URL" -o "$RUNNER_TEMP/CocosCreator-v3.8.8-mac-010512.zip"
          shasum -a 256 "$RUNNER_TEMP/CocosCreator-v3.8.8-mac-010512.zip" | tee "$RUNNER_TEMP/evidence/installer-sha256.txt"
          ditto -x -k "$RUNNER_TEMP/CocosCreator-v3.8.8-mac-010512.zip" "$RUNNER_TEMP/cocos"
          app="$(find "$RUNNER_TEMP/cocos" -name CocosCreator.app -type d -print -quit)"
          test -n "$app"
          test -x "$app/Contents/MacOS/CocosCreator"
          printf '%s\n' "$app" > "$RUNNER_TEMP/evidence/app-path.txt"
          file "$app/Contents/MacOS/CocosCreator" | tee "$RUNNER_TEMP/evidence/executable-file.txt"
          codesign -dv --verbose=4 "$app" 2> "$RUNNER_TEMP/evidence/codesign.txt" || true
          plutil -p "$app/Contents/Info.plist" > "$RUNNER_TEMP/evidence/info-plist.txt"

      - name: Run actual editor executable
        id: editor
        continue-on-error: true
        run: |
          set +e
          app="$(cat "$RUNNER_TEMP/evidence/app-path.txt")"
          cli="$app/Contents/MacOS/CocosCreator"
          "$cli" --version > "$RUNNER_TEMP/evidence/version-stdout.txt" 2> "$RUNNER_TEMP/evidence/version-stderr.txt"
          rc=$?
          echo "$rc" | tee "$RUNNER_TEMP/evidence/version-exit-code.txt"
          pgrep -fl CocosCreator > "$RUNNER_TEMP/evidence/processes.txt" || true
          exit "$rc"

      - name: Summarize macOS execution
        if: always()
        run: |
          set -euxo pipefail
          {
            echo "editor_outcome=${{ steps.editor.outcome }}"
            echo "exit_code=$(cat "$RUNNER_TEMP/evidence/version-exit-code.txt" 2>/dev/null || echo missing)"
            echo '--- stdout ---'
            cat "$RUNNER_TEMP/evidence/version-stdout.txt" 2>/dev/null || true
            echo '--- stderr ---'
            cat "$RUNNER_TEMP/evidence/version-stderr.txt" 2>/dev/null || true
          } | tee "$RUNNER_TEMP/evidence/summary.txt"

      - name: Upload macOS editor execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-creator-388-macos-execution-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
