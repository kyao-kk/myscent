name: temporary-cocos-runtime-bundle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-runtime-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify Cocos Creator 3.8.8 Windows package
        env:
          COCOS_URL: https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-121518.zip
        run: |
          set -euxo pipefail
          mkdir -p bundle/cocos
          curl --fail --location --retry 3 --retry-delay 10 "$COCOS_URL" -o bundle/cocos/CocosCreator-v3.8.8-win-121518.zip
          sha256sum bundle/cocos/CocosCreator-v3.8.8-win-121518.zip | tee bundle/cocos/CocosCreator-v3.8.8-win-121518.zip.sha256
          file bundle/cocos/CocosCreator-v3.8.8-win-121518.zip
          unzip -t bundle/cocos/CocosCreator-v3.8.8-win-121518.zip
          unzip -l bundle/cocos/CocosCreator-v3.8.8-win-121518.zip | tee bundle/cocos/CocosCreator-v3.8.8-win-121518.contents.txt
          grep -E 'CocosCreator(\.exe)?$' bundle/cocos/CocosCreator-v3.8.8-win-121518.contents.txt

      - name: Download and verify portable Wine
        env:
          WINE_URL: https://github.com/Kron4ek/Wine-Builds/releases/download/11.11/wine-11.11-staging-amd64-wow64.tar.xz
          WINE_SHA256: bf9ba91bccd3129bd8dee31dcff76e94b38898cee70b9ecf4dda4c0d8d9df25a
        run: |
          set -euxo pipefail
          mkdir -p bundle/wine
          curl --fail --location --retry 3 --retry-delay 10 "$WINE_URL" -o bundle/wine/wine-11.11-staging-amd64-wow64.tar.xz
          echo "$WINE_SHA256  bundle/wine/wine-11.11-staging-amd64-wow64.tar.xz" | sha256sum --check
          tar -tf bundle/wine/wine-11.11-staging-amd64-wow64.tar.xz | head -200 > bundle/wine/wine-contents.txt

      - name: Write bundle manifest
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          files=[]
          for path in sorted(pathlib.Path('bundle').rglob('*')):
              if path.is_file():
                  files.append({'path': str(path), 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          pathlib.Path('bundle/runtime-bundle-manifest.json').write_text(json.dumps({'schemaVersion':1,'files':files},indent=2)+'\n')
          PY
          cat bundle/runtime-bundle-manifest.json

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: cocos-creator-388-windows-wine-bundle
          path: bundle
          compression-level: 0
          if-no-files-found: error
